name: djia_impl_2023_2025
description: >-
  Alternative four-year training windows and one-year tests stated in the
  manuscript Implementation Details. Included to expose, not conceal, the date
  inconsistency with the dataset table.
windows:
  - name: test_2023
    panel_path: data/processed/djia_2023_full.npz
    train_start: 2019-01-01
    train_end: 2022-12-31
    validation_start: 2022-10-01
    validation_end: 2022-12-31
    test_start: 2023-01-01
    test_end: 2023-12-31
    universe: data/universes/djia_2023.csv
  - name: test_2024
    panel_path: data/processed/djia_2024_full.npz
    train_start: 2020-01-01
    train_end: 2023-12-31
    validation_start: 2023-10-01
    validation_end: 2023-12-31
    test_start: 2024-01-01
    test_end: 2024-12-31
    universe: data/universes/djia_2024.csv
  - name: test_2025
    panel_path: data/processed/djia_2025_full.npz
    train_start: 2021-01-01
    train_end: 2024-12-31
    validation_start: 2024-10-01
    validation_end: 2024-12-31
    test_start: 2025-01-01
    test_end: 2025-12-31
    universe: data/universes/djia_2025.csv
