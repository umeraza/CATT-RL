[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "catt-rl"
version = "0.1.0"
description = "Reproducible CATT-RL implementation for transaction-aware portfolio management"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Umar Raza Mukhtar"},
  {name = "Hamza Mukhtar", email = "hamza.hm.mukhtar@gmail.com"},
  {name = "Hessa Alfraihi"},
]
keywords = ["portfolio management", "reinforcement learning", "transformer", "PPO", "quantitative finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=0.29,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.10,<2",
  "torch>=2.1,<3",
  "tqdm>=4.66,<5",
  "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
qlib = ["pyqlib>=0.9.6"]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
catt-rl = "catt_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catt_rl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
